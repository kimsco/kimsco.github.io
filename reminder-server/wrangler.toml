name = "ttt-workout-reminder"
main = "worker.mjs"
compatibility_date = "2026-10-27"

[vars]
REMINDERS_ENABLED = "false"

[triggers]
# Each minute checks individual Korea-time preferences. Once/device/day/selected time.
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ttt-workout-reminder"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
