name = "ttt-workout-reminder"
main = "worker.mjs"
compatibility_date = "2026-10-27"

[vars]
REMINDERS_ENABLED = "false"

[triggers]
# Korea 22:00, then drain additional batches at one-minute intervals. Once/device/day.
crons = ["* 13 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ttt-workout-reminder"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
